[package]
name = "neurogenesis-ai"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["json", "http1", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.42.0", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "io-util", "sync"] }
tower-http = { version = "0.6.11", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }

[[bin]]
name = "neurogenesis"
path = "src/main.rs"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
tempfile = "3.27.0"
